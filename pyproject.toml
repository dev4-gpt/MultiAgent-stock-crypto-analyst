[project]
name = "trade-buddy"
version = "0.1.0"
description = "MarketMind: multi-agent stock/crypto analyst evolving into a screenshot-to-trade-setup product"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fredapi>=0.5.2",
    "langchain-core>=1.3.2",
    "langchain-groq>=1.1.2",
    "langgraph>=1.1.10",
    "newsapi-python>=0.2.7",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pycoingecko>=3.2.0",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "streamlit>=1.57.0",
    "yfinance>=1.3.0",
]

[project.optional-dependencies]
eval = ["anthropic>=0.40", "pytest>=8", "mplfinance>=0.12", "matplotlib>=3.8"]
